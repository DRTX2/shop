spring:
  application:
    name: demo

  datasource:
    url: jdbc:postgresql://localhost:5432/demo_db
    username: root
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update  # "create", "validate", "none", "update" or "create-drop"
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # Optional: for clean sql
  output:
    ansi:
      enabled: always

server:
  port: 8080

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
